[package]
name = "rust-task-manager"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["macros"] }
tokio = { version = "1.53.1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio", "tls-rustls", "macros", "chrono"] }
dotenvy = "0.15.7"
thiserror = "2.0.21"
reqwest = { version = "0.13.5", features = ["json"] }
rand = "0.10.3"
chrono = { version = "0.4.45", features = ["serde"] }
argon2 = { version = "0.6.0", features = ["getrandom"] }
serde_json = "1.0.151"

[[bin]]
name = "seed_tasks"
path = "tools/seed_tasks.rs"

[[bin]]
name = "truncate_tasks"
path = "tools/truncate_tasks.rs"


[[bin]]
name = "truncate_users"
path = "tools/truncate_users.rs"
